name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify .NET formatting
        run: dotnet format DenariusAI.slnx whitespace --verify-no-changes

      - name: Check for unresolved merge-conflict markers
        shell: bash
        run: |
          set -euo pipefail

          if git grep -n -E '^(<<<<<<< |>>>>>>> )' -- \
            '*.cs' '*.csproj' '*.props' '*.targets' '*.json' '*.yml' '*.yaml' \
            '*.xml' '*.cshtml' '*.js' '*.css' '*.sh' '*.bat' '*.ps1'; then
            echo 'Unresolved merge-conflict markers were found in tracked source or configuration files.' >&2
            exit 1
          fi

          echo 'No unresolved merge-conflict markers found.'

      - name: Check for prohibited tracked files
        shell: bash
        run: |
          set -euo pipefail

          prohibited=()
          while IFS= read -r path; do
            if [[ "$path" =~ (^|/)\.env($|\.) ]] && [[ ! "$path" =~ (^|/)\.env\.example$ ]]; then
              prohibited+=("$path")
              continue
            fi

            if [[ "$path" =~ (^|/)(secrets\.json|appsettings\.Local\.json)$ ]]; then
              prohibited+=("$path")
              continue
            fi

            if [[ "$path" =~ \.(bak|bacpac|mdf|ldf|db|db3|sqlite|sqlite3)$ ]]; then
              prohibited+=("$path")
            fi
          done < <(git ls-files)

          if (( ${#prohibited[@]} > 0 )); then
            echo 'Prohibited tracked files were found:' >&2
            printf ' - %s\n' "${prohibited[@]}" >&2
            exit 1
          fi

          echo 'No prohibited tracked files found.'

  dotnet:
    name: Build and test .NET
    needs: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore DenariusAI.slnx

      - name: Build
        run: dotnet build DenariusAI.slnx --configuration Release --no-restore

      - name: Run tests with coverage
        run: >-
          dotnet test DenariusAI.slnx
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
          --logger "trx;LogFilePrefix=test-results"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-and-coverage
          path: TestResults/
          if-no-files-found: error
          retention-days: 14

  docker:
    name: Build Docker (${{ matrix.component }})
    needs: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: web
            target: final
          - component: mcp
            target: mcp-final

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
